[workspace]
resolver = "2"
members = [
    "crates/s2g-phy",
    "crates/s2g-mac",
    "crates/s2g-dsp",
    "crates/s2g-sdr",
    "crates/s2g-sdr-pluto",
    "crates/s2g-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
num-complex = "0.4"
rustfft = "6.4"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

s2g-phy = { path = "crates/s2g-phy" }
s2g-mac = { path = "crates/s2g-mac" }
s2g-dsp = { path = "crates/s2g-dsp" }
s2g-sdr = { path = "crates/s2g-sdr" }
s2g-sdr-pluto = { path = "crates/s2g-sdr-pluto" }

[profile.release]
lto = "thin"
