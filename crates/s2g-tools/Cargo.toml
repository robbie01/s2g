[package]
name = "s2g-tools"
description = "CLI tools: s2g-tx, s2g-rx, s2g-sim, s2g-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
s2g-phy.workspace = true
s2g-mac.workspace = true
s2g-dsp.workspace = true
s2g-sdr.workspace = true
num-complex.workspace = true
anyhow.workspace = true
clap.workspace = true
rand.workspace = true

[dependencies.s2g-sdr-pluto]
workspace = true
optional = true

# TAP devices via tappers (Linux, macOS, *BSD).
[target.'cfg(unix)'.dependencies]
tappers = { version = "0.4", optional = true }

# Windows L2 TAP via the OpenVPN tap-windows6 driver (src/wintap.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Registry"] }

[features]
default = ["pluto"]
pluto = ["dep:s2g-sdr-pluto"]
tap = ["dep:tappers"]

[[bin]]
name = "s2g-tx"
path = "src/bin/s2g-tx.rs"

[[bin]]
name = "s2g-rx"
path = "src/bin/s2g-rx.rs"

[[bin]]
name = "s2g-sim"
path = "src/bin/s2g-sim.rs"

[[bin]]
name = "s2g-node"
path = "src/bin/s2g-node.rs"
